<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrammarFlow - AI Writing Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=4.4">
    <!-- Document Processing Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <!-- Export Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docx@8.1.0/build/index.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-circle" id="appLogo"></div>
            <h1>GrammarFlow</h1>
        </header>

        <main class="panel glass-card">
            
            <div class="tabs">
                <button class="tab-btn active" id="tabText">Text Editor</button>
                <button class="tab-btn" id="tabDocument">Document AI</button>
            </div>

            <!-- Text Editor Mode -->
            <div id="textModeContainer">
                <div class="editor-container">
                    <div id="highlighterOverlay" class="highlighter-overlay"></div>
                    <textarea id="inputText" placeholder="Start typing naturally..." spellcheck="false"></textarea>
                </div>
            </div>

            <!-- Document AI Mode -->
            <div id="documentModeContainer" class="hidden">
                <div class="document-upload-zone" id="documentUploadZone">
                    <div class="upload-icon">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    </div>
                    <p class="upload-title">Drop an image or PDF here</p>
                    <p class="upload-subtitle">or click to browse files</p>
                    <input type="file" id="fileInput" accept="image/*,application/pdf" multiple class="hidden-file-input">
                </div>
                
                <div id="filePreviewContainer" class="file-preview-container hidden"></div>

                <div class="button-group document-buttons">
                    <button id="cancelProcessBtn" class="secondary-btn hidden">Cancel</button>
                    <button id="processDocBtn" class="primary-btn fluid-btn">Process Document</button>
                </div>

                <div class="controls document-controls">
                    <select id="documentModeSelect">
                        <option value="Summarize">Summarize Key Points</option>
                        <option value="Simplify">Simplify Language</option>
                        <option value="Translate">Translate</option>
                        <option value="Explain">Explain to a 10-year-old</option>
                        <option value="Grammar">Fix Grammar & OCR Errors</option>
                    </select>
                    <button id="processDocumentBtn" class="primary-btn full-width" disabled>Process Document</button>
                </div>
            </div>
            
            <div class="controls" id="globalControls">
                <select id="styleSelect"><option>Casual</option><option>Formal</option><option>Concise</option></select>
                <select id="toneSelect"><option>Friendly</option><option>Polite</option><option>Direct</option></select>
                <select id="languageSelect">
                    <option value="Auto">Auto-Detect</option>
                    <option value="English">English</option>
                    <option value="Hindi">Hindi</option>
                    <option value="Hinglish">Hinglish</option>
                    <option value="Kannada">Kannada</option>
                    <option value="Telugu">Telugu</option>
                </select>
                <div class="humanize-wrapper">
                    <span style="font-size: 0.85rem; font-weight: 500;">Human Mode</span>
                    <label class="switch">
                        <input type="checkbox" id="humanizeToggle" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="button-group" id="textActionButtons">
                <button id="fixGrammarBtn" class="secondary-btn">Fix Grammar</button>
                <button id="rewriteBtn" class="primary-btn">Rewrite Paragraph</button>
            </div>

            <div id="outputSection" class="output-section hidden">
                <div id="loadingIndicator" class="spinner hidden"></div>
                <div id="resumePrompt" class="resume-prompt hidden">
                    <p>Found a previous session for this file. Resume from where you left off?</p>
                    <div class="button-group mini">
                        <button id="resumeYesBtn" class="primary-btn">Yes, Resume</button>
                        <button id="resumeNoBtn" class="secondary-btn">Start Fresh</button>
                    </div>
                </div>
                <div class="results-list" id="resultsList"></div>
                <div id="exportControls" class="export-controls hidden">
                    <button id="downloadPdfBtn" class="export-btn pdf">Download PDF</button>
                    <button id="downloadDocxBtn" class="export-btn docx">Download Word</button>
                </div>
            </div>
        </main>

        <!-- Adaptive Suggestion Bar -->
        <div id="assistantBar" class="assistant-bar">
            <div class="assistant-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
                    <path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/>
                </svg>
            </div>
            <div class="suggestion-content">
                <div class="suggestion-header">
                    <div class="suggestion-label" id="suggestionLabel">SUGGESTION</div>
                    <div class="suggestion-counter" id="suggestionCounter"></div>
                </div>
                <div class="suggestion-text" id="suggestionText">Loading suggestion...</div>
            </div>
            <div class="assistant-actions">
                <button id="prevSuggestionBtn" class="nav-btn" title="Previous">&#8592;</button>
                <button id="nextSuggestionBtn" class="nav-btn" title="Next">&#8594;</button>
                <button id="applySuggestionBtn" class="apply-btn">Apply</button>
            </div>
        </div>

    </div>

    <script src="app.js?v=4.4"></script>
</body>
</html>
