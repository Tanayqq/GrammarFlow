<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrammarFlow - AI Writing Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-circle" id="appLogo"></div>
            <h1>GrammarFlow</h1>
        </header>

        <main class="panel glass-card">
            <div class="editor-container">
                <div id="highlighterOverlay" class="highlighter-overlay"></div>
                <textarea id="inputText" placeholder="Start typing naturally..." spellcheck="false"></textarea>
            </div>
            
            <div class="controls">
                <select id="styleSelect"><option>Casual</option><option>Formal</option><option>Concise</option></select>
                <select id="toneSelect"><option>Friendly</option><option>Polite</option><option>Direct</option></select>
                <select id="languageSelect">
                    <option value="Auto">Auto-Detect</option>
                    <option value="English">English</option>
                    <option value="Hindi">Hindi</option>
                    <option value="Hinglish">Hinglish</option>
                    <option value="Kannada">Kannada</option>
                    <option value="Telugu">Telugu</option>
                </select>
                <div class="humanize-wrapper">
                    <span style="font-size: 0.85rem; font-weight: 500;">Human Mode</span>
                    <label class="switch">
                        <input type="checkbox" id="humanizeToggle" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="button-group">
                <button id="fixGrammarBtn" class="secondary-btn">Fix Grammar</button>
                <button id="rewriteBtn" class="primary-btn">Rewrite Paragraph</button>
            </div>

            <div id="outputSection" class="output-section hidden">
                <div id="loadingIndicator" class="spinner hidden"></div>
                <div class="results-list" id="resultsList"></div>
            </div>
        </main>

        <!-- Adaptive Suggestion Bar -->
        <div id="assistantBar" class="assistant-bar">
            <div class="assistant-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
                    <path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/>
                </svg>
            </div>
            <div class="suggestion-content">
                <div class="suggestion-header">
                    <div class="suggestion-label" id="suggestionLabel">SUGGESTION</div>
                    <div class="suggestion-counter" id="suggestionCounter"></div>
                </div>
                <div class="suggestion-text" id="suggestionText">Loading suggestion...</div>
            </div>
            <div class="assistant-actions">
                <button id="prevSuggestionBtn" class="nav-btn" title="Previous">&#8592;</button>
                <button id="nextSuggestionBtn" class="nav-btn" title="Next">&#8594;</button>
                <button id="applySuggestionBtn" class="apply-btn">Apply</button>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
