<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GrammarFlow Focused Editor</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts for Inter -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style data-purpose="custom-theme">
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #080312; /* Deep cosmic dark */
      color: #e2e8f0;
      overflow: hidden; /* Prevent scrolling for the focused UI */
    }

    /* Cosmic Nebula Background */
    .cosmic-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
                  radial-gradient(circle at 20% 80%, rgba(30, 64, 175, 0.1) 0%, transparent 40%);
      background-color: #080312;
    }

    /* Floating Nebula Glows */
    .nebula-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.2) 0%, transparent 70%);
      filter: blur(80px);
      z-index: -1;
    }

    /* Glassmorphism Panel */
    .glass-panel {
      background: rgba(23, 23, 33, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    /* Specific Inner Glows and Borders */
    .glow-border-purple {
      border: 1.5px solid rgba(168, 85, 247, 0.4);
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.2);
    }

    .btn-gradient {
      background: linear-gradient(90deg, #a855f7 0%, #3b82f6 100%);
      transition: all 0.3s ease;
    }

    .btn-gradient:hover {
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
      transform: translateY(-1px);
    }

    /* Custom Scrollbar for Textarea */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }
  </style>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cosmic: {
              900: '#080312',
              800: '#13111c',
              700: '#1f1d2b',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="flex items-center justify-center min-h-screen p-4 md:p-8">
<!-- BEGIN: Background Elements -->
<div class="cosmic-bg"></div>
<div class="nebula-glow" style="top: -100px; right: -100px;"></div>
<div class="nebula-glow" style="bottom: -150px; left: -100px; background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%);"></div>
<!-- END: Background Elements -->
<!-- BEGIN: Focused Editor Container -->

<div class="dashboard-layout" style="display: grid; grid-template-columns: 240px 1fr; min-height: 100vh;">
<aside class="sidebar" style="background: rgba(10, 10, 15, 0.8); border-right: 1px solid rgba(255, 255, 255, 0.1); padding: 24px; display: flex; flex-direction: column;">
    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 48px;">
        <div style="width: 32px; height: 32px; background: linear-gradient(135deg, #A855F7 0%, #3B82F6 100%); border-radius: 8px;"></div>
        <h2 style="font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 700; color: white;">GrammarFlow</h2>
    </div>
    <nav style="display: flex; flex-direction: column; gap: 8px; flex-grow: 1;">
        <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: #A855F7; background: rgba(168, 85, 247, 0.1); text-decoration: none; border-radius: 12px; font-weight: 500;">Home</a>
        <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: #94A3B8; text-decoration: none; border-radius: 12px; font-weight: 500;">Documents</a>
        <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: #94A3B8; text-decoration: none; border-radius: 12px; font-weight: 500;">Templates</a>
    </nav>
</aside>
<div class="main-content" style="display: flex; flex-direction: column; padding: 24px 40px;">
<header class="top-nav" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px;">
    <div style="display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); padding: 12px 20px; border-radius: 12px; width: 400px;">
        <span style="color: #94A3B8;">Search documents...</span>
    </div>
    <button style="background: linear-gradient(135deg, #A855F7 0%, #3B82F6 100%); color: white; border: none; padding: 12px 20px; border-radius: 12px; font-weight: 600;">New Document</button>
</header>
<main class="w-full max-w-5xl" data-purpose="editor-main-container">
<div class="glass-panel rounded-3xl overflow-hidden p-6 md:p-8 flex flex-col gap-6 relative">
<!-- BEGIN: Navigation Tabs -->
<nav class="flex justify-center items-center mb-2" data-purpose="editor-tabs">
<div class="bg-[#1a1a2e] rounded-xl p-1.5 flex gap-2 border border-white/5">
<button class="px-8 py-2.5 rounded-lg text-sm font-medium transition-all duration-200 bg-[#252545] text-white glow-border-purple shadow-lg">
            Text Editor
          </button>
<button class="px-8 py-2.5 rounded-lg text-sm font-medium transition-all duration-200 text-gray-400 hover:text-white hover:bg-white/5">
            Document AI
          </button>
</div>
</nav>
<!-- END: Navigation Tabs -->
<!-- BEGIN: Text Area -->
<div class="relative group" data-purpose="editor-canvas">
<textarea class="w-full h-80 md:h-96 bg-black/20 rounded-2xl p-6 text-lg text-white/90 placeholder:text-gray-600 focus:outline-none focus:ring-1 focus:ring-purple-500/50 border border-white/5 resize-none custom-scrollbar transition-all" id="inputText" placeholder="Start typing naturally..."></textarea>
<!-- Subtle corner accents could go here -->
</div>
<!-- END: Text Area -->
<!-- BEGIN: Controls Footer -->
<div class="flex flex-wrap items-center justify-between gap-6 pt-2" data-purpose="editor-controls">
<!-- Tone Selection and Toggle Group -->
<div class="flex flex-wrap items-center gap-6">
<div class="flex items-center gap-3">
<span class="text-sm font-medium text-gray-400">Tone:</span>
<div class="flex gap-2">
<button class="px-5 py-2 rounded-full text-xs font-semibold bg-purple-500/10 text-purple-400 border border-purple-500/50 shadow-[0_0_10px_rgba(168,85,247,0.2)]">
                Casual
              </button>
<button class="px-5 py-2 rounded-full text-xs font-semibold bg-white/5 text-gray-400 border border-white/10 hover:bg-white/10 transition-colors">
                Friendly
              </button>
<button class="px-5 py-2 rounded-full text-xs font-semibold bg-white/5 text-gray-400 border border-white/10 hover:bg-white/10 transition-colors">
                Auto-Detect
              </button>
</div>
</div>
<div class="flex items-center gap-3">
<span class="text-sm font-medium text-gray-400">Human Mode</span>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-purple-600"></div>
</label>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-1 md:flex-none gap-3">
<button class="flex-1 md:flex-none px-10 py-4 rounded-2xl font-semibold text-gray-300 bg-[#252545] border border-white/5 hover:bg-[#2d2d55] transition-all">
            <span id="fixGrammarBtn" style="display:block;width:100%;height:100%;">Fix Grammar</span>
          </button>
<button class="flex-1 md:flex-none px-10 py-4 rounded-2xl font-bold text-white btn-gradient shadow-lg">
            <span id="rewriteBtn" style="display:block;width:100%;height:100%;">Rewrite Paragraph</span>
          </button>
</div>
</div>
<!-- END: Controls Footer -->
</div>
<!-- Branding Footer (Optional) -->
<div class="mt-8 text-center opacity-30 select-none">
<span class="text-xs uppercase tracking-widest text-white">Powered by GrammarFlow AI Engine</span>
</div>

<div class="hidden" style="display:none;">
    <select id="toneSelect"><option value="Casual">Casual</option></select>
    <select id="styleSelect"><option value="Casual">Casual</option></select>
    <select id="languageSelect"><option value="Auto">Auto-Detect</option></select>
    <input type="checkbox" id="humanizeToggle" checked>
    <div id="outputSection"><div id="resultsList"></div></div>
    <div id="assistantBar"><div id="suggestionText"></div><div id="suggestionLabel"></div><button id="applySuggestionBtn"></button></div>
</div>

</main>
<!-- END: Focused Editor Container -->
<!-- BEGIN: Interactive Logic (Non-functional placeholders for UI state) -->
<script data-purpose="ui-interactivity">
    // Simple state management for the demo buttons
    document.querySelectorAll('[data-purpose="editor-tabs"] button').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('[data-purpose="editor-tabs"] button').forEach(b => {
          b.classList.remove('bg-[#252545]', 'text-white', 'glow-border-purple', 'shadow-lg');
          b.classList.add('text-gray-400', 'hover:text-white', 'hover:bg-white/5');
        });
        this.classList.add('bg-[#252545]', 'text-white', 'glow-border-purple', 'shadow-lg');
        this.classList.remove('text-gray-400', 'hover:text-white', 'hover:bg-white/5');
      });
    });

    document.querySelectorAll('.flex.gap-2 button').forEach(btn => {
      btn.addEventListener('click', function() {
        if (this.parentElement.previousElementSibling?.textContent === 'Tone:') {
           this.parentElement.querySelectorAll('button').forEach(b => {
             b.classList.remove('bg-purple-500/10', 'text-purple-400', 'border-purple-500/50', 'shadow-[0_0_10px_rgba(168,85,247,0.2)]');
             b.classList.add('bg-white/5', 'text-gray-400', 'border-white/10');
           });
           this.classList.add('bg-purple-500/10', 'text-purple-400', 'border-purple-500/50', 'shadow-[0_0_10px_rgba(168,85,247,0.2)]');
           this.classList.remove('bg-white/5', 'text-gray-400', 'border-white/10');
        }
      });
    });
  </script>
<!-- END: Interactive Logic -->
</div></div>
<script src="app.js?v=4.6"></script>
</body></html>
