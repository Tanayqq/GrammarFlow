<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GrammarFlow Focused Editor</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts for Inter -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style data-purpose="custom-theme">
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #080312; /* Deep cosmic dark */
      color: #e2e8f0;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Cosmic Nebula Background */
    .cosmic-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
                  radial-gradient(circle at 20% 80%, rgba(30, 64, 175, 0.1) 0%, transparent 40%);
      background-color: #080312;
    }

    /* Floating Nebula Glows */
    .nebula-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.2) 0%, transparent 70%);
      filter: blur(80px);
      z-index: -1;
    }

    /* Glassmorphism Panel */
    .glass-panel {
      background: rgba(23, 23, 33, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    /* Specific Inner Glows and Borders */
    .glow-border-purple {
      border: 1.5px solid rgba(168, 85, 247, 0.4);
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.2);
    }

    .btn-gradient {
      background: linear-gradient(90deg, #a855f7 0%, #3b82f6 100%);
      transition: all 0.3s ease;
    }

    .btn-gradient:hover {
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
      transform: translateY(-1px);
    }

    /* Custom Scrollbar for Textarea */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }

    /* Floating AI Assistant Bar styling */
    #assistantBar.visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    /* Shadow Highlighter Overlay Underlines */
    #highlighterOverlay mark {
      background: transparent !important;
      color: transparent !important;
      border-bottom: 2px dashed rgba(168, 85, 247, 0.85); /* Purple glowing dashed underline */
      box-shadow: 0 2px 8px rgba(168, 85, 247, 0.3);
      padding-bottom: 1px;
    }
    
    #highlighterOverlay .highlight-clarity {
      border-bottom: 2px dashed rgba(59, 130, 246, 0.85) !important; /* Blue for clarity */
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3) !important;
    }
    
    #highlighterOverlay .highlight-tone {
      border-bottom: 2px dashed rgba(236, 72, 153, 0.85) !important; /* Pink for tone */
      box-shadow: 0 2px 8px rgba(236, 72, 153, 0.3) !important;
    }

    #highlighterOverlay .highlight-flow {
      border-bottom: 2px dashed rgba(16, 185, 129, 0.85) !important; /* Green for flow */
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3) !important;
    }
    
    #highlighterOverlay .highlight-grammar {
      border-bottom: 2px dashed rgba(239, 68, 68, 0.85) !important; /* Red for grammar */
      box-shadow: 0 2px 8px rgba(239, 68, 68, 0.3) !important;
    }
  </style>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cosmic: {
              900: '#080312',
              800: '#13111c',
              700: '#1f1d2b',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="flex items-center justify-center min-h-screen p-4 md:p-8">

<div class="cosmic-bg"></div>
<div class="nebula-glow" style="top: -100px; right: -100px;"></div>
<div class="nebula-glow" style="bottom: -150px; left: -100px; background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%);"></div>

<main class="w-full max-w-5xl mx-auto" data-purpose="editor-main-container">
    <div class="glass-panel rounded-3xl overflow-hidden p-6 md:p-8 flex flex-col gap-6 relative">
        
        <!-- Tabs Navigation -->
        <nav class="flex justify-center items-center mb-2" data-purpose="editor-tabs">
            <div class="bg-[#1a1a2e] rounded-xl p-1.5 flex gap-2 border border-white/5">
                <button id="tabText" class="px-8 py-2.5 rounded-lg text-sm font-medium transition-all duration-200 bg-[#252545] text-white glow-border-purple shadow-lg">Text Editor</button>
                <button id="tabDocument" class="px-8 py-2.5 rounded-lg text-sm font-medium transition-all duration-200 text-gray-400 hover:text-white hover:bg-white/5">Document AI</button>
            </div>
        </nav>

        <!-- TEXT MODE CONTAINER -->
        <div id="textModeContainer">
            <div class="relative w-full bg-[#0f0b1e]/50 border border-white/5 rounded-2xl transition-all focus-within:ring-1 focus-within:ring-purple-500/50" data-purpose="editor-canvas">
                <!-- Shadow Highlighter Overlay for wavy underlining -->
                <div id="highlighterOverlay" class="absolute inset-0 pointer-events-none text-transparent whitespace-pre-wrap break-words overflow-y-auto w-full h-full p-6 text-lg rounded-2xl border border-transparent custom-scrollbar leading-relaxed"></div>
                
                <!-- Active Textarea -->
                <textarea class="w-full h-80 md:h-96 bg-transparent text-lg text-white/90 p-6 placeholder:text-gray-600 focus:outline-none resize-none custom-scrollbar transition-all relative z-10 leading-relaxed" id="inputText" placeholder="Start typing naturally..."></textarea>

                <!-- Immersive Flow Expand Button -->
                <button id="expandFlowBtn" class="expand-flow-btn" title="Expand to Immersive Flow-State Editor">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
                    Flow Focus
                </button>
            </div>


            <!-- TEXT EDITOR LOADING INDICATOR & OUTPUT CONTAINER -->
            <div id="loadingIndicator" class="hidden mt-6 flex flex-col items-center justify-center p-8 gap-4 bg-purple-950/20 border border-purple-500/10 rounded-2xl">
                <div class="w-10 h-10 border-4 border-purple-500/30 border-t-purple-500 rounded-full animate-spin shadow-[0_0_15px_rgba(168,85,247,0.5)]"></div>
                <span class="text-purple-400 font-medium tracking-wider text-sm uppercase">Analyzing Text & Processing AI...</span>
                <button id="cancelProcessBtn" class="hidden px-5 py-2.5 rounded-xl text-xs font-bold text-red-400 border border-red-500/30 bg-red-500/10 hover:bg-red-500/20 hover:text-white transition-all cursor-pointer flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" ry="2" stroke-width="2"></rect></svg>
                    Stop Process
                </button>
            </div>

            <div id="outputSection" class="hidden mt-6">
                <div class="bg-black/30 border border-white/10 rounded-2xl p-6 relative group overflow-y-auto max-h-[350px] custom-scrollbar">
                    <div class="absolute inset-0 bg-gradient-to-r from-purple-500/5 to-blue-500/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <div id="resultsList" class="relative z-10 text-white/90 text-lg leading-relaxed flex flex-col gap-4"></div>
                </div>
            </div>
        </div>

        <!-- DOCUMENT AI MODE CONTAINER -->
        <div id="documentModeContainer" class="hidden">
            
<section class="mb-6" data-purpose="upload-section">
<div class="relative group cursor-pointer border-2 border-dashed border-white/20 rounded-3xl py-16 px-6 flex flex-col items-center justify-center transition-all hover:border-white/40 hover:bg-white/5" id="documentUploadZone">
<!-- Cloud Icon -->
<div class="mb-4 bg-white/5 p-4 rounded-full border border-white/10">
<svg class="text-gray-400 group-hover:text-white transition-colors" fill="none" height="48" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewbox="0 0 24 24" width="48" xmlns="http://www.w3.org/2000/svg">
<path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path>
<path d="M12 12v9"></path>
<path d="m16 16-4-4-4 4"></path>
</svg>
</div>
<p class="text-xl text-gray-300 text-center font-light tracking-wide">
          Drag &amp; drop your document (PDF, Image) here, or <span class="text-nebula-purple font-medium">click to browse</span>
</p>
</div>
<!-- Uploaded File Previews Section -->
<div id="filePreviewContainer" class="hidden mt-4 flex flex-wrap gap-3 p-4 bg-white/5 border border-white/10 rounded-2xl"></div>
</section>

            

<section class="mb-6" data-purpose="input-section">
<div class="flex flex-col md:flex-row gap-4 mb-4">
    <div class="flex items-center gap-3">
        <span class="text-sm font-medium text-gray-400 whitespace-nowrap">Document Mode:</span>
        <div class="relative w-full md:w-auto">

                <option value="Summarize" selected>Summarize Document</option>
                <option value="Grammar">Extract & Fix Grammar (OCR)</option>
                <option value="Explain">Explain Like a 10 Year Old</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </div>
        </div>
    </div>
</div>
            <!-- DOCUMENT AI LOADING INDICATOR & OUTPUT CONTAINER -->
            <div id="docLoadingIndicator" class="hidden mt-6 flex flex-col items-center justify-center p-8 gap-4 bg-purple-950/20 border border-purple-500/10 rounded-2xl">
                <div class="w-10 h-10 border-4 border-purple-500/30 border-t-purple-500 rounded-full animate-spin shadow-[0_0_15px_rgba(168,85,247,0.5)]"></div>
                <span class="text-purple-400 font-medium tracking-wider text-sm uppercase">Analyzing Document & Processing AI...</span>
                <button id="docCancelProcessBtn" class="hidden px-5 py-2.5 rounded-xl text-xs font-bold text-red-400 border border-red-500/30 bg-red-500/10 hover:bg-red-500/20 hover:text-white transition-all cursor-pointer flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" ry="2" stroke-width="2"></rect></svg>
                    Stop Process
                </button>
            </div>

            <div id="docOutputSection" class="hidden mt-6">
                <div class="bg-black/30 border border-white/10 rounded-2xl p-6 relative group overflow-y-auto max-h-[350px] custom-scrollbar">
                    <div class="absolute inset-0 bg-gradient-to-r from-purple-500/5 to-blue-500/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <div id="docResultsList" class="relative z-10 text-white/90 text-lg leading-relaxed flex flex-col gap-4"></div>
                </div>
            </div>
        </div>

        <!-- SHARED FOOTER CONTROLS -->
        <div class="flex flex-wrap items-center justify-between gap-6 pt-2" data-purpose="editor-controls">
            

<div class="flex flex-wrap items-center gap-6" id="globalControls">
    <!-- Language Dropdown -->

        <span class="text-sm font-medium text-gray-400">Language:</span>
        <div class="relative">

                <option value="Telugu">Telugu</option>

            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </div>
        </div>
    </div>

    <!-- Style Dropdown -->
    <div class="flex items-center gap-3">
        <span class="text-sm font-medium text-gray-400">Style:</span>
        <div class="relative">
            <select id="styleSelect" class="appearance-none bg-[#252545] border border-white/10 rounded-full py-2 pl-4 pr-10 text-sm font-semibold text-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500/50 hover:bg-[#2d2d55] transition-all cursor-pointer shadow-[0_0_10px_rgba(168,85,247,0.1)]">
                <option value="Professional">Professional</option>
                <option value="Academic">Academic</option>
                <option value="Casual" selected>Casual</option>
                <option value="Creative">Creative</option>
                <option value="Direct">Direct</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </div>
        </div>
    </div>

    <!-- Tone Dropdown -->
    <div class="flex items-center gap-3">
        <span class="text-sm font-medium text-gray-400">Tone:</span>
        <div class="relative">
            <select id="toneSelect" class="appearance-none bg-[#252545] border border-white/10 rounded-full py-2 pl-4 pr-10 text-sm font-semibold text-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500/50 hover:bg-[#2d2d55] transition-all cursor-pointer shadow-[0_0_10px_rgba(168,85,247,0.1)]">
                <option value="Neutral">Neutral</option>
                <option value="Confident">Confident</option>
                <option value="Friendly" selected>Friendly</option>
                <option value="Persuasive">Persuasive</option>
                <option value="Empathetic">Empathetic</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </div>
        </div>
    </div>

    <div class="flex items-center gap-3">
        <span class="text-sm font-medium text-gray-400">Human Mode</span>

        <label class="relative inline-flex items-center cursor-pointer">
            <input id="humanizeToggle" type="checkbox" class="sr-only peer" checked>
            <div class="w-11 h-6 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-purple-600"></div>
        </label>
    </div>
</div>

            
            <!-- Text Actions -->
            <div id="textActionContainer">
                
<div class="flex flex-1 md:flex-none gap-3" id="textActionButtons">
    <button id="fixGrammarBtn" class="flex-1 md:flex-none px-10 py-4 rounded-2xl font-semibold text-gray-300 bg-[#252545] border border-white/5 hover:bg-[#2d2d55] transition-all">Fix Grammar</button>
    <button id="rewriteBtn" class="flex-1 md:flex-none px-10 py-4 rounded-2xl font-bold text-white bg-gradient-to-r from-purple-500 to-blue-500 shadow-[0_0_20px_rgba(168,85,247,0.4)] hover:shadow-[0_0_30px_rgba(168,85,247,0.6)]">Rewrite Paragraph</button>
</div>

            </div>

            <!-- Document Actions -->
            <div id="documentActionContainer" class="hidden">
                <div class="flex justify-center" data-purpose="action-section">
                    <button class="w-full px-10 py-5 rounded-2xl font-bold text-white text-lg bg-gradient-to-r from-purple-500 to-blue-500 shadow-[0_0_20px_rgba(168,85,247,0.4)] hover:shadow-[0_0_30px_rgba(168,85,247,0.6)] hover:scale-[1.01] active:scale-[0.99] transition-all flex items-center justify-center gap-3 cursor-pointer" id="processDocumentBtn">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                        Process Document
                    </button>
                </div>
            </div>
        </div>

        <!-- HIDDEN APP.JS BINDINGS -->
        <div class="hidden" style="display:none;">
            <input type="file" id="fileInput" accept="image/*,application/pdf" multiple>
            <div id="highlighterOverlay"></div>
            <div id="appLogo"></div>
            <button id="processDocBtn"></button>
            <div id="resumePrompt"></div>
            <button id="resumeYesBtn"></button>
            <button id="resumeNoBtn"></button>
            <div id="exportControls"></div>
            <button id="downloadPdfBtn"></button>
            <button id="downloadDocxBtn"></button>
        </div>

    </div>
</main>

<!-- FLOATING AI ASSISTANT BAR (GrammarFlow Writing Assistant) -->
<div id="assistantBar" class="fixed bottom-8 left-1/2 -translate-x-1/2 translate-y-[150%] w-[90%] max-w-2xl bg-[#13111c]/95 backdrop-blur-xl border border-purple-500/30 rounded-2xl p-4 md:p-5 flex flex-col md:flex-row items-start md:items-center justify-between gap-4 shadow-[0_20px_50px_rgba(0,0,0,0.5),0_0_30px_rgba(168,85,247,0.15)] transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] z-[1000] opacity-0 pointer-events-none">
    <!-- Dismiss Close Button -->
    <button id="closeAssistantBtn" class="absolute top-2.5 right-2.5 p-1.5 rounded-lg text-gray-400 hover:text-white hover:bg-white/10 transition-all cursor-pointer" title="Dismiss suggestion">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>

    <!-- Left Section: Status & Suggestion -->
    <div class="flex items-start gap-4 flex-1 pr-6 md:pr-4">
        <!-- Magic Wand AI Icon -->
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-500 to-blue-500 flex items-center justify-center shadow-[0_0_15px_rgba(168,85,247,0.3)] shrink-0 mt-1 md:mt-0">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19.485 14.828l-9.9 9.9-4.244-4.243 9.9-9.9m4.244 4.243L22 7.757m-2.515-2.515l-1.657-1.657m0 0L12 10.243m4.243-4.243L18.5 3.5M6 6L4 4m2 2L4 8m2-2h2m4-2h2m-6 16h2"></path>
            </svg>
        </div>
        
        <!-- Text details -->
        <div class="flex-1 min-w-0">
            <div class="flex items-center gap-3 mb-1">
                <span id="suggestionLabel" class="text-xs font-extrabold text-purple-400 uppercase tracking-widest">Grammar Suggestion</span>
                <span id="suggestionCounter" class="text-xs text-gray-400 bg-white/5 border border-white/10 px-2 py-0.5 rounded-full font-medium" style="display: none;"></span>
            </div>
            <div id="suggestionText" class="text-sm text-gray-200 leading-relaxed"></div>
        </div>
    </div>
    
    <!-- Right Section: Actions -->
    <div class="flex items-center justify-end gap-3 w-full md:w-auto border-t border-white/5 md:border-t-0 pt-3 md:pt-0 shrink-0">
        <!-- Navigation Buttons -->
        <div class="flex items-center gap-1.5 bg-white/5 border border-white/10 rounded-xl p-1">
            <button id="prevSuggestionBtn" class="p-2 rounded-lg text-gray-400 hover:text-white hover:bg-white/10 disabled:opacity-30 disabled:pointer-events-none transition-all" title="Previous Suggestion">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <button id="nextSuggestionBtn" class="p-2 rounded-lg text-gray-400 hover:text-white hover:bg-white/10 disabled:opacity-30 disabled:pointer-events-none transition-all" title="Next Suggestion">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
            </button>
        </div>
        
        <!-- Apply Button -->
        <button id="applySuggestionBtn" class="flex-1 md:flex-none px-5 py-2.5 rounded-xl text-sm font-bold text-white bg-gradient-to-r from-purple-500 to-blue-500 hover:shadow-[0_0_15px_rgba(168,85,247,0.4)] hover:scale-[1.02] transition-all">
            Apply
        </button>
    </div>
</div>
<!-- External Document Processing Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="app.js?v=4.8"></script>
<script>
    // Tab Switching Logic for Tailwind UI
    document.getElementById('tabText').addEventListener('click', function() {
        this.classList.add('bg-[#252545]', 'text-white', 'glow-border-purple', 'shadow-lg');
        this.classList.remove('text-gray-400');
        
        const docTab = document.getElementById('tabDocument');
        docTab.classList.remove('bg-[#252545]', 'text-white', 'glow-border-purple', 'shadow-lg');
        docTab.classList.add('text-gray-400');
        
        document.getElementById('textModeContainer').classList.remove('hidden');
        document.getElementById('textActionContainer').classList.remove('hidden');
        document.getElementById('documentModeContainer').classList.add('hidden');
        document.getElementById('documentActionContainer').classList.add('hidden');
    });

    document.getElementById('tabDocument').addEventListener('click', function() {
        this.classList.add('bg-[#252545]', 'text-white', 'glow-border-purple', 'shadow-lg');
        this.classList.remove('text-gray-400');
        
        const txtTab = document.getElementById('tabText');
        txtTab.classList.remove('bg-[#252545]', 'text-white', 'glow-border-purple', 'shadow-lg');
        txtTab.classList.add('text-gray-400');
        
        document.getElementById('documentModeContainer').classList.remove('hidden');
        document.getElementById('documentActionContainer').classList.remove('hidden');
        document.getElementById('textModeContainer').classList.add('hidden');
        document.getElementById('textActionContainer').classList.add('hidden');
    });
</script>


<script>
    function selectTone(value, btn) {
        // Find the select element
        if (value === 'Auto') {
            document.getElementById('languageSelect').value = value;
        } else {
            document.getElementById('toneSelect').value = value;
        }

        // Visually update the chips
        const parent = btn.parentElement;
        parent.querySelectorAll('button').forEach(b => {
            b.classList.remove('bg-purple-500/10', 'text-purple-400', 'border-purple-500/50', 'shadow-[0_0_10px_rgba(168,85,247,0.2)]');
            b.classList.add('bg-white/5', 'text-gray-400', 'border-white/10');
            
            // For the stitch_doc_ai style chips
            b.classList.remove('chip-active');
            b.classList.remove('text-white');
        });

        // Add active classes to the clicked button
        btn.classList.remove('bg-white/5', 'text-gray-400', 'border-white/10');
        btn.classList.add('bg-purple-500/10', 'text-purple-400', 'border-purple-500/50', 'shadow-[0_0_10px_rgba(168,85,247,0.2)]');
        
        // Also add stitch_doc_ai style active classes just in case
        btn.classList.add('chip-active');
    }
</script>
